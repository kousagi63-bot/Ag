<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Agro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 404 Section -->
  <section class="page-banner" style="background: linear-gradient(135deg, #1d4527, #2e7d32);">
    <div class="container">
      <h1 style="font-size: clamp(4rem, 12vw, 8rem); margin-bottom: 10px; text-shadow: var(--shadow-lg);">404</h1>
      <h2 style="font-size: clamp(1.6rem, 4vw, 2.4rem);">Oops! This page went to pasture.</h2>
      <p style="color: rgba(255,255,255,0.85); max-width: 560px; margin: 18px auto 28px;">
        The page you are looking for has been plowed under. It may have been moved, renamed, or never existed.
      </p>
      <a href="index.html" class="btn btn-accent">
        <span>Back to Home</span>
        <i class="fas fa-arrow-left"></i>
      </a>
      <button class="btn btn-outline" onclick="history.back()">
        <span>Go Back</span>
        <i class="fas fa-undo"></i>
      </button>
    </div>
  </section>

  <!-- Shopping Cart Drawer -->
  <div class="cart-drawer-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Harvest Basket</h3>
      <button class="close-drawer-btn" id="closeCartBtn">&times;</button>
    </div>
    <div class="cart-items-list" id="cartItems">
      <div class="empty-cart-msg"><i class="fas fa-shopping-basket"></i><h4>Your basket is empty</h4></div>
    </div>
    <div class="cart-footer">
      <div class="cart-subtotal"><span>Subtotal:</span><span id="cartSubtotal">$0.00</span></div>
      <div class="cart-actions">
        <button class="btn btn-primary" id="checkoutBtn"><span>Proceed to Checkout</span><i class="fas fa-lock"></i></button>
      </div>
    </div>
  </aside>

  <div class="toast-container" id="toastContainer"></div>
  <script src="app.js"></script>
</body>
</html>
